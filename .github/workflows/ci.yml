name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI entry point exists
        run: test -f bin/cli.mjs && echo "bin/cli.mjs found" || (echo "bin/cli.mjs MISSING" && exit 1)

      - name: Verify skill manifest has entries
        run: |
          count=$(grep -c . _config/skill-manifest.csv || true)
          echo "skill-manifest.csv lines: $count"
          [ "$count" -gt 0 ] || (echo "skill-manifest.csv is empty" && exit 1)

      - name: Verify orchestrator loads
        run: node --input-type=module -e "import('./core/orchestrator.mjs').then(() => process.exit(0)).catch(e => { console.error(e); process.exit(1); })"

      - name: Run installer --help
        run: node bin/cli.mjs --help
