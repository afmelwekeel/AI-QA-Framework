name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify CLI entry point exists
        run: node --input-type=module <<'EOF'
          import { existsSync } from 'fs';
          if (!existsSync('./bin/cli.mjs')) throw new Error('bin/cli.mjs missing');
          console.log('bin/cli.mjs found');
          EOF

      - name: Verify skill manifests are valid
        run: node --input-type=module <<'EOF'
          import { readFileSync } from 'fs';
          const manifest = readFileSync('./_config/skill-manifest.csv', 'utf8');
          const lines = manifest.trim().split('\n').filter(l => l && !l.startsWith('#'));
          console.log(`skill-manifest.csv: ${lines.length} skills registered`);
          if (lines.length === 0) throw new Error('No skills in manifest');
          EOF

      - name: Verify orchestrator loads
        run: node -e "import('./core/orchestrator.mjs').then(() => console.log('orchestrator OK'))"

      - name: Run installer --help (smoke test)
        run: node bin/cli.mjs --help
