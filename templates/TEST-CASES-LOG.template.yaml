# Test Cases Log
# One entry per test-case FILE (not per case). Written by /aiqa-create-testcases (status: Pending),
# updated by /aiqa-run-tests after each case so it always shows the file's current overall status.
# Per-case statuses live only in the test-case file and the results file.
# File status (derived from its cases):
#   Pending     no case executed yet
#   In Progress some cases executed, some still Pending
#   Pass        every case Pass
#   Fail        at least one case Fail
#   Blocked     no Fail, at least one Blocked or Not Run
# Tested = anything except Pending.

totals:
  files: 0
  pending: 0
  in_progress: 0
  pass: 0
  fail: 0
  blocked: 0

files:
  - story: "<story-folder>"
    file: test-cases/<story-folder>/01-screen.test-cases.md   # relative to TestResult/
    cases: 0
    status: Pending
    updated: "<YYYY-MM-DD>"
