name: analyze-bugs
description: 'Triage test failures and generate Arabic bug reports in /bug-reports/ (Phase 6). Use when user says "analyze bugs" or runs /aiqa-analyzebugs'

config_source: "{project-root}/AI-QA-FRAMEWORK/config.yaml"
user_name: "{config_source}:user_name"
communication_language: "{config_source}:communication_language"
reporting_language: "{config_source}:reporting_language"
output_folder: "{config_source}:output_folder"
project_name: "{config_source}:project_name"

installed_path: "{project-root}/AI-QA-FRAMEWORK/workflows/analyze-bugs"
instructions: "{installed_path}/instructions.xml"

# Runtime variables — resolved from TestResult/test-suites.yml
suite_name: ""     # From argument or active_suite in TestResult/test-suites.yml
story_id: ""       # Same value as suite_name
