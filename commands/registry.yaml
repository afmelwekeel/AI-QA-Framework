# AI QA Framework — Command Registry v3
# The framework has 3 prompts: write test cases, execute tests, fix bug.
# Everything else (setup, fullworkflow, terse, stats) supports them.
version: 3
commands:
  # ── Setup (once per project) ───────────────────────────────────────────────
  - id: setup
    slash: /aiqa-setup
    skill: project-setup
    workflow: setup
    description: Detect stack, fill config.yaml, test users, generate EXECUTION-GUIDE / INDEX / DATABASE-TABLES
    args: []

  # ── The 3 prompts ──────────────────────────────────────────────────────────
  - id: write-test-cases
    slash: /aiqa-create-testcases
    skill: write-test-cases
    workflow: write-test-cases
    prompt: reusable-prompts/write-test-cases.prompt.md
    description: "Prompt 2 — story file → test-case Markdown files (one per screen)"
    args: [{ name: story, required: true }]

  - id: execute-tests
    slash: /aiqa-run-tests
    skill: execute-tests
    workflow: execute-tests
    prompt: reusable-prompts/execute-tests.prompt.md
    description: "Prompt 1 — run one test-case file with Playwright MCP (browser visible by default), write results, screenshots, bugs"
    args:
      - { name: file,     required: false }
      - { name: headless, required: false, flag: true, notes: "only when the user asked not to see the browser" }
      - { name: summary,  required: false, flag: true, notes: "final restore check + SUMMARY.md" }

  - id: fix-bug
    slash: /aiqa-fixbug
    skill: fix-bug
    workflow: fix-bug
    prompt: reusable-prompts/fix-bug.prompt.md
    description: "Prompt 3 — reproduce, fix, verify, commit one bug"
    args: [{ name: bug, required: false }]

  # ── Master ─────────────────────────────────────────────────────────────────
  - id: full-workflow
    slash: /aiqa-fullworkflow
    workflow: full-workflow
    description: "Chain: setup check → write test cases → execute each file → file bugs → optional fixes → SUMMARY. User confirms between prompts"
    args: [{ name: story, required: false }]

  # ── Utility ────────────────────────────────────────────────────────────────
  - id: analyze-project
    skill: project-analysis
    description: Detect stack, routes, auth, DB (used by setup)
    args: []

  # ── Token Minimization ─────────────────────────────────────────────────────
  - id: aiqa-terse
    description: Switch terse output mode level (lite | full | ultra | off)
    args: [{ name: level, required: false, default: full }]
    notes: Handled by hooks/prompt-submit.js. No skill script.

  - id: aiqa-tokenstats
    script: core/token-stats.mjs
    description: Show token usage + savings; --all lifetime; --since 7d window
    args:
      - { name: session-file, required: false }
      - { name: all,          required: false, flag: true }
      - { name: since,        required: false }
      - { name: share,        required: false, flag: true }
    notes: Intercepted by hooks/prompt-submit.js as decision:block.

  - id: aiqa-terse-help
    description: Show terse mode quick-reference card
    args: []
    notes: One-shot display handled inline by qae.md persona.
